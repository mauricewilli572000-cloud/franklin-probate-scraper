<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franklin County Probate Leads</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#6b7385; --line:#e3e6ec; --accent:#2457c5; --hot:#c23b22; --warm:#d48a00; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:18px 24px; background:var(--card); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  h1 { font-size:18px; margin:0 12px 0 0; }
  .stat { color:var(--muted); } .stat b { color:var(--ink); }
  .controls { padding:14px 24px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  input, select { padding:7px 9px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  input[type=search] { width:260px; }
  a.btn { padding:7px 12px; border-radius:6px; background:var(--accent); color:#fff; text-decoration:none; }
  .wrap { padding:0 24px 40px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; background:var(--card); border:1px solid var(--line); }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { background:#fafbfc; font-weight:600; cursor:pointer; white-space:nowrap; position:sticky; top:0; }
  td small { color:var(--muted); display:block; }
  .score { font-weight:700; padding:2px 8px; border-radius:10px; background:#eef1f6; }
  .s-hot { background:#fde8e4; color:var(--hot); } .s-warm { background:#fff2d6; color:var(--warm); }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:8px; background:#eef1f6; margin:2px 2px 0 0; }
  tr.detail td { background:#fbfcfe; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Franklin County Probate Leads</h1>
  <span class="stat">Leads: <b id="n">–</b></span>
  <span class="stat">Pending match: <b id="pend">–</b></span>
  <span class="stat">Updated: <b id="upd">–</b></span>
</header>
<div class="controls">
  <input type="search" id="q" placeholder="Search name, address, case #">
  <select id="status"><option value="">All property status</option><option value="in_decedent_name">Still in decedent's name</option><option value="transferred_to_heirs">Inherited by heirs</option></select>
  <select id="sub"><option value="">All estate types</option></select>
  <select id="minscore"><option value="0">Any score</option><option value="40">Score 40+</option><option value="60">Score 60+</option></select>
  <select id="added"><option value="">Any date added</option><option value="1">Added today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select>
  <a class="btn" href="ghl_probate_leads.csv" download>Download GHL CSV</a>
</div>
<div class="wrap">
  <table>
    <thead><tr>
      <th data-k="score">Score</th><th data-k="date_added">Added</th><th data-k="filing_date">Filed</th>
      <th data-k="case_name">Decedent</th><th data-k="prop">Property</th><th data-k="value">Value</th>
      <th data-k="fid">Executor (contact)</th><th data-k="subtype">Estate type</th><th>Case</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody>
  </table>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = v => v ? "$" + Number(v).toLocaleString() : "";
let data = [], sortKey = "score", sortDir = -1;

const val = (r, k) => ({ prop: r.property?.property_address, value: r.property?.market_value,
  fid: r.fiduciary?.name }[k] ?? r[k] ?? "");

function render() {
  const q = $("#q").value.trim().toUpperCase(), st = $("#status").value, sub = $("#sub").value;
  const min = +$("#minscore").value, addedDays = +$("#added").value;
  const cutoff = addedDays ? new Date(Date.now() - (addedDays - 1) * 864e5).toISOString().slice(0, 10) : "";
  let rows = data.filter(r => {
    if (st && r.property?.status !== st) return false;
    if (sub && r.subtype !== sub) return false;
    if ((r.score || 0) < min) return false;
    if (cutoff && (r.date_added || "") < cutoff) return false;
    if (q) {
      const hay = [r.case_name, r.case_key, r.property?.property_address, r.fiduciary?.name,
                   r.fiduciary?.street, r.decedent_street, r.attorney?.name].join(" ").toUpperCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  rows.sort((a, b) => { const x = val(a, sortKey), y = val(b, sortKey);
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  $("#rows").innerHTML = rows.length ? rows.map(r => {
    const p = r.property || {}, f = r.fiduciary || {}, at = r.attorney || {};
    const cls = r.score >= 60 ? "s-hot" : r.score >= 40 ? "s-warm" : "";
    const tags = [p.status === "transferred_to_heirs" ? "inherited" : "in decedent's name",
                  p.has_mortgage_escrow ? "mortgage escrow" : "no escrow",
                  p.rental ? "rental" : "", p.matched_by === "owner_name" ? `name match (${p.confidence})` : "", (r.other_properties || []).length ? `+${r.other_properties.length} parcels` : ""]
                  .filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("");
    return `<tr title="${esc((r.score_reasons || []).join(" · "))}">
      <td><span class="score ${cls}">${r.score ?? ""}</span></td>
      <td>${esc(r.date_added)}</td>
      <td>${esc(r.filing_date)}<small>DOD ${esc(r.date_of_death)}</small></td>
      <td>${esc(r.case_name)}</td>
      <td>${esc(p.property_address)}<small>${esc(p.property_city)} ${esc(p.property_zip)} · ${esc(p.parcel_id)}</small>
          <small>${esc(p.property_class)}${p.year_built ? " · built " + esc(p.year_built) : ""}</small>${tags}</td>
      <td>${money(p.market_value)}<small>${p.last_sale_date ? "last sale " + esc(p.last_sale_date) : ""}</small></td>
      <td>${esc(f.name)} <small>${esc(f.title)}</small><small>${esc(f.street)}, ${esc(f.city)} ${esc(f.state)} ${esc(f.zip)}</small>
          <small>${esc(f.phone)}</small>${at.name ? `<small>Atty: ${esc(at.name)} ${esc(at.phone)}</small>` : ""}</td>
      <td>${esc(r.subtype)}</td>
      <td><a href="${esc(r.court_url)}" target="_blank" rel="noopener">${esc(r.case_key)}</a></td></tr>`;
  }).join("") : `<tr><td colspan="9" class="empty">No leads match these filters.</td></tr>`;
}

document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : -1; sortKey = k; render(); });
["#q", "#status", "#sub", "#minscore", "#added"].forEach(s => $(s).addEventListener("input", render));

Promise.all([fetch("records.json", {cache: "no-store"}).then(r => r.json()),
             fetch("meta.json", {cache: "no-store"}).then(r => r.json()).catch(() => ({}))])
  .then(([recs, meta]) => {
    data = recs; $("#n").textContent = recs.length;
    $("#pend").textContent = meta.pending ?? "–"; $("#upd").textContent = (meta.updated || "").replace("T", " ");
    [...new Set(recs.map(r => r.subtype))].sort().forEach(s => $("#sub").insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`));
    render();
  }).catch(e => { $("#rows").innerHTML = `<tr><td colspan="9" class="empty">Could not load records.json (${esc(e)})</td></tr>`; });
</script>
</body>
</html>
