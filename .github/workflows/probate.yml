name: Franklin probate leads

on:
  schedule:
    - cron: "37 11 * * *"     # daily ~6:37 AM Eastern (court data is current as of the prior day)
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days of filings to scan (use 120 for a first backfill)"
        default: "10"

permissions:
  contents: write

concurrency:
  group: probate-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run pipeline
        run: python run_pipeline.py --days-back "${{ github.event.inputs.days_back || '10' }}"
      - name: Commit results
        run: |
          git config user.name "probate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Probate leads $(date -u +%F)"
          git pull --rebase
          git push
