name: Probate - Summit

on:
  schedule:
    - cron: "7 12 * * *"     # daily ~7:07 AM Eastern
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days of filings to scan (use 120 for a first backfill)"
        default: "10"
      refresh_parcels:
        description: "Only re-run parcel lookups for existing leads (yes/no)"
        default: "no"
      max_minutes:
        description: "Stop cleanly after this many minutes and save (re-run to continue)"
        default: "300"

permissions:
  contents: write

concurrency:
  group: probate-summit
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340       # GitHub's hard limit is 360; the script stops itself before this
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - name: Run pipeline
        run: >
          python run_pipeline.py --county summit
          --days-back "${{ github.event.inputs.days_back || '10' }}"
          --max-minutes "${{ github.event.inputs.max_minutes || '300' }}"
          ${{ github.event.inputs.refresh_parcels == 'yes' && '--refresh-parcels' || '' }}
      - name: Commit results (runs even if the pipeline failed, so progress is never lost)
        if: always()
        run: |
          git config user.name "probate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/summit docs/data/summit
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Summit probate leads $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
